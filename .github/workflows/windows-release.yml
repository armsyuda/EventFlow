name: Windows build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 03_Program

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 03_Program/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build EventFlow
        shell: pwsh
        run: ./build_windows.ps1

      - name: Package update archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/EventFlow/* -DestinationPath EventFlow-Windows.zip -CompressionLevel Optimal
          $hash = (Get-FileHash EventFlow-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  EventFlow-Windows.zip" | Set-Content EventFlow-Windows.zip.sha256 -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EventFlow-Windows
          path: |
            03_Program/EventFlow-Windows.zip
            03_Program/EventFlow-Windows.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            03_Program/EventFlow-Windows.zip
            03_Program/EventFlow-Windows.zip.sha256

